# https://taskfile.dev

version: '3'

vars:
  GOPROXY: 'https://goproxy.cn,direct'
  GOSUMDB: sum.golang.google.cn
  ROOT_DIR: $(pwd)
  BUILD_DIR: $(pwd)/_output
  BIN_DIR: $(pwd)/_output/one-hub
  VERSION_PKG: one-api/common/config
  BUILD_VERSION: $(git describe --tags || echo "dev")
  BUILD_DATE: $(date +%Y%m%d)
  GIT_BRANCH: $(git branch -r --contains | head -1 | sed -E -e "s%(HEAD ->|origin|upstream)/?%%g" | xargs)
  GIT_COMMIT: $(git rev-parse --short HEAD || echo "abcdefgh")
  BUILD_RELEASE: "{{.BUILD_VERSION}}-{{.BUILD_DATE}}-{{.GIT_COMMIT}}"
  IMAGE: "ttl.sh/one-hub:{{.BUILD_RELEASE}}"
  LOCAL_OS: $(go version | awk '{print $NF}')
  GOOS: $(go env GOOS)
  GOARCH: $(go env GOARCH)
  LDFLAGS: "-w -s \
    -extldflags '-static' \
    -X '{{.VERSION_PKG}}.Version={{.BUILD_VERSION}}' \
    -X '{{.VERSION_PKG}}.BuildTime={{.BUILD_DATE}}' \
    -X '{{.VERSION_PKG}}.Commit={{.GIT_COMMIT}}'"

tasks:
  web:
    desc: build web
    cmds:
      - hack/scripts/genui.sh {{.BUILD_VERSION}}
    status:
      - test -f web/build/index.html

  gomod:
    desc: update go mod
    cmds:
      - go mod tidy

  gofmt:
    cmds:
      - go install golang.org/x/tools/cmd/goimports@latest
      - gofmt -s -w .
      - goimports -w .

  golint:
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - golangci-lint run -v ./...

  lint:
    cmds:
      - task: gofmt
      - task: golint

  fmt:
    cmds:
      - task: gomod
      - task: gofmt
      - task: golint

  clean:
    desc: clean
    run: once
    cmds:
      - rm -rf web/build
      - rm -rf {{.BUILD_DIR}}

  run:
    desc: run
    deps:
      - build
    cmds:
      - "{{.BIN_DIR}}"

  build:
    desc: build binary
    deps:
      - gomod
      - web
    cmds:
      - go build -o {{.BIN_DIR}} -ldflags "{{.LDFLAGS}}"

  docker:
    desc: build docker image
    deps:
      - gomod
      - web
    cmds:
      - GOOS=linux GOARCH=amd64 go build -o {{.BIN_DIR}} -ldflags "{{.LDFLAGS}}"
      - docker buildx build --pull --push --platform linux/amd64 -t "{{.IMAGE}}" .

  # 测试相关任务
  test:unit:
    desc: "运行单元测试（Mock DB）"
    cmds:
      - go test -v ./test/unit/...

  test:integration:
    desc: "运行集成测试"
    cmds:
      - go test -v ./test/integration/...

  test:model:
    desc: "运行 Model 层测试"
    cmds:
      - go test -v ./test/unit/model/...

  test:controller:
    desc: "运行 Controller 层测试"
    cmds:
      - go test -v ./test/unit/controller/...

  test:all:
    desc: "运行所有测试"
    cmds:
      - go test -v ./test/...

  test:coverage:
    desc: "运行测试并生成覆盖率报告"
    cmds:
      - go test -v -coverprofile=coverage.out ./test/...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "覆盖率报告已生成: coverage.html"

  test:benchmark:
    desc: "运行性能基准测试"
    cmds:
      - go test -v -bench=. -benchmem ./test/...

  test:race:
    desc: "运行竞态条件检测测试"
    cmds:
      - go test -v -race ./test/...

  test:mock:
    desc: "使用 Mock 数据库运行测试"
    env:
      TEST_DB: mock
    cmds:
      - go test -v ./test/...

  test:sqlite:
    desc: "使用 SQLite 数据库运行测试"
    env:
      TEST_DB: sqlite
    cmds:
      - go test -v ./test/...

  test:clean:
    desc: "清理测试生成的文件"
    cmds:
      - rm -f coverage.out coverage.html
      - rm -f test.db test.db-journal

  default:
    cmds:
      - task: build
